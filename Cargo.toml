[package]
name = "json-lines-viewer"
version = "0.5.2"
edition = "2024"
description = "JSON Lines Viewer - Terminal-UI to view app logs available in JSON line format"
authors = ["bitmagier"]
keywords = ["JSON", "viewer", "TUI"]
license = "MIT"
repository = "https://github.com/bitmagier/json-lines-viewer"

[dependencies]
ratatui = "0.30.0-alpha.5"
crossterm = "0"
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
dirs = "6"
toml = "1"
rustc-hash = "2"
zip = "8"
anstyle = "1"
